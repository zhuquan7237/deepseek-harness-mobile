<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="katex.min.css">
<style>
  html, body {
    margin: 0; padding: 0; background: transparent;
    /* 禁止 WebView 的字体自动放大（font boosting）：窄视口下它会把字号偷偷放大，
       量出来的尺寸和实际画出来的对不上（抓图出现巨字/切片就是这个原因）。 */
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  body { overflow: hidden; }
  /* 公式容器钉死在视口左上角：普通流里的元素会被 Chromium 的滚动/视口偏移带走
     （实机上出现过公式被推到 x<0、只剩右半截的怪象） */
  #wrap { position: fixed; left: 0; top: 0; }
  #h { display: inline-block; color: #000; padding: 0; margin: 0; }
</style>
</head>
<body>
<div id="wrap"><div id="h"></div></div>
<script src="katex.min.js"></script>
<script>
  // 渲染辅助页：把一段 LaTeX 画成 DOM，调用方（Kotlin）负责量尺寸、截图。
  // 字体没就绪时量出来的宽高是错的 —— 所以先把 KaTeX 用到的字族全部 load 完再放行。
  window.__ready = false;
  (function () {
    var fams = ['KaTeX_AMS', 'KaTeX_Caligraphic', 'KaTeX_Fraktur', 'KaTeX_Main',
                'KaTeX_Math', 'KaTeX_SansSerif', 'KaTeX_Script', 'KaTeX_Size1',
                'KaTeX_Size2', 'KaTeX_Size3', 'KaTeX_Size4', 'KaTeX_Typewriter'];
    var jobs = [];
    for (var i = 0; i < fams.length; i++) {
      try {
        jobs.push(document.fonts.load('10px ' + fams[i]));
        jobs.push(document.fonts.load('italic 10px ' + fams[i]));
        jobs.push(document.fonts.load('bold 10px ' + fams[i]));
      } catch (e) { /* 老内核没有 fonts.load 就退到 ready 兜底 */ }
    }
    Promise.allSettled(jobs).then(function () { return document.fonts.ready; }).then(function () {
      window.__ready = true;
    }).catch(function () { window.__ready = true; });
  })();

  // 诊断探针（仅当 Kotlin 侧设了 window.__diag 时由 __render 调用）：把
  // 「字体实际加载状态 / 大运算符的真实盒尺寸 / 画布度量」回传给 Kotlin 打印。
  // 2026-09-26 排查「公式整体比桌面矮 38%」时加，稳定后可删。
  window.__probe = function () {
    var out = {};
    try { out.fs = getComputedStyle(document.getElementById('h')).fontSize; } catch (e) {}
    try { out.dpr = window.devicePixelRatio; } catch (e) {}
    try {
      out.fmain = document.fonts.check('16px KaTeX_Main');
      out.fmath = document.fonts.check('italic 16px KaTeX_Math');
      out.fsz2 = document.fonts.check('16px KaTeX_Size2');
      out.fsz1 = document.fonts.check('16px KaTeX_Size1');
    } catch (e) {}
    try {
      var st = [];
      document.fonts.forEach(function (f) { st.push(f.family.replace('KaTeX_', '') + ':' + f.status); });
      out.fst = st.join(',').slice(0, 800);
    } catch (e) {}
    try {
      var op = document.querySelector('#h .large-op') || document.querySelector('#h .mop');
      if (op) {
        var rr = op.getBoundingClientRect();
        var cs = getComputedStyle(op);
        out.op = [Math.round(rr.width * 10) / 10, Math.round(rr.height * 10) / 10,
                  cs.fontFamily.slice(0, 36), cs.fontSize, cs.lineHeight];
        var inner = op.querySelector('*');
        if (inner) {
          var r2 = inner.getBoundingClientRect();
          out.opIn = [Math.round(r2.width * 10) / 10, Math.round(r2.height * 10) / 10];
        }
      }
    } catch (e) {}
    try {
      var st2 = document.querySelector('#h .katex .katex-strut') || document.querySelector('#h .strut');
      if (st2) { out.strut = Math.round(st2.getBoundingClientRect().height * 10) / 10; }
    } catch (e) {}
    try {
      var c = document.createElement('canvas').getContext('2d');
      c.font = '16px KaTeX_Math';
      var w1 = c.measureText('y').width;
      c.font = '16px KaTeX_Size2';
      var w2 = c.measureText('\u222B').width;
      c.font = '16px serif';
      var w3 = c.measureText('\u222B').width;
      out.mw = [Math.round(w1 * 100) / 100, Math.round(w2 * 100) / 100, Math.round(w3 * 100) / 100];
    } catch (e) {}
    return out;
  };

  // 渲染一段公式并返回矩形尺寸；失败返回 null（Kotlin 侧保留原文展示）。
  window.__render = function (latex, display, color, cssPx) {
    try {
      var h = document.getElementById('h');
      if (!h) return null;
      window.scrollTo(0, 0);
      h.style.color = color;
      h.style.fontSize = cssPx + 'px';
      h.innerHTML = '';
      katex.render(latex, h, {
        displayMode: !!display,
        throwOnError: false,
        strict: 'ignore',
        output: 'html'
      });
      var r = h.getBoundingClientRect();
      if (window.__diag) {
        try {
          console.log('DIAG ' + JSON.stringify({
            fs: getComputedStyle(h).fontSize,
            cw: document.documentElement.clientWidth,
            iw: window.innerWidth,
            sx: window.scrollX,
            sy: window.scrollY,
            vvx: window.visualViewport ? window.visualViewport.offsetLeft : null,
            vvy: window.visualViewport ? window.visualViewport.offsetTop : null,
            vvs: window.visualViewport ? window.visualViewport.scale : null,
            dpr: window.devicePixelRatio
          }));
        } catch (e) {}
      }
      return {
        x: Math.floor(r.left),
        y: Math.floor(r.top),
        w: Math.ceil(r.width),
        h: Math.ceil(r.height),
        vw: document.documentElement.clientWidth,
        vvs: window.visualViewport ? window.visualViewport.scale : 1,
        dpr: window.devicePixelRatio,
        p: window.__diag && window.__probe ? window.__probe() : null
      };
    } catch (e) {
      return null;
    }
  };

  // Kotlin 把 LaTeX 以 base64(UTF-8) 传进来 —— 反斜杠、引号、中文都不用操心转义。
  window._u = function (b) {
    var s = atob(b), a = [];
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      if (c < 128) { a.push(String.fromCharCode(c)); }
      else if (c > 191 && c < 224) { a.push(String.fromCharCode((c & 31) << 6 | s.charCodeAt(++i) & 63)); }
      else { a.push(String.fromCharCode((c & 15) << 12 | (s.charCodeAt(++i) & 63) << 6 | s.charCodeAt(++i) & 63)); }
    }
    return a.join('');
  };

  // 分块抓取用：把内容整体左移（cssPx 为 CSS 像素，负数=左移）。0 = 复位。
  window.__shift = function (cssPx) {
    var w = document.getElementById('wrap');
    if (w) w.style.left = (-cssPx) + 'px';
    return 'ok';
  };

  // 调试辅助：直接往 #h 里放一段 raw HTML/文本（测试对拍用）。
  window.__rawtext = function (t, cssPx) {
    var h = document.getElementById('h');
    h.style.fontSize = (cssPx || 34) + 'px';
    h.innerHTML = t;
    return h.getBoundingClientRect().height;
  };

  // 让浏览器把新内容光栅化干净：连续两帧 requestAnimationFrame 后才算 settled。
  window.__settled = true;
  window.__settle = function () {
    window.__settled = false;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { window.__settled = true; });
    });
  };

  // 调试钩子：math.html?t=<urlencoded LaTeX>&display=1 —— 页面载入后直接渲染一条，
  // 方便在桌面浏览器里验证页面本身（不经过 App）。
  (function () {
    var m = /[?&]t=([^&]+)/.exec(location.search);
    if (!m) return;
    var latex = decodeURIComponent(m[1]);
    var isDisplay = /[?&]display=1/.test(location.search);
    var wait = setInterval(function () {
      if (window.__ready) {
        clearInterval(wait);
        window.__render(latex, isDisplay, '#111111', 22);
        window.__settle();
      }
    }, 50);
  })();
</script>
</body>
</html>

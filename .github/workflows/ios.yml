name: ios.yml
# iOS 只能在 macOS 上构建。这份流水线把 GitHub 的 macOS runner 当"云 Mac"：
# xcodegen 生成工程 → xcodebuild 出 iphonesimulator 包 → xcrun simctl 起真模拟器 →
# 安装/启动/截图/断言 → 产物回传；打 tag 或发布 Release 时把 .app 附到同版本下。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "可选：把 iOS 产物附到这个已存在的 Release tag"
        required: false
        default: ""
  push:
    tags:
      - "ios-*"
    branches:
      - master
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - ".github/scripts/**"
  release:
    types: [published]

permissions:
  contents: write

# 同一分支/标签只保留最新一次 iOS 验证，避免连推时排队。
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APP_ID: com.dsh.mobile.ios
      MOCK_PORT: "8099"
      MOCK_CODE: TEST-1234
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号（与 Android 同源）
        id: ver
        run: |
          set -euo pipefail
          VERSION=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)"/\1/')
          CODE=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | head -1 | awk '{print $3}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Android 同源版本：$VERSION ($CODE)"

      - name: 工具链版本
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          swift --version 2>/dev/null || true

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          cd ios
          xcodegen generate

      - name: 构建模拟器包
        run: |
          set -o pipefail
          cd ios
          xcodebuild \
            -project DshMobile.xcodeproj \
            -scheme DshMobile \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION='${{ steps.ver.outputs.version }}' \
            CURRENT_PROJECT_VERSION='${{ steps.ver.outputs.code }}' \
            build 2>&1 | tee build.log | grep -E 'error:|warning: .*(deprecated|unused)|BUILD' || true
          if ! grep -q 'BUILD SUCCEEDED' build.log; then
            echo '--- 构建失败，最后 200 行 ---'
            tail -200 build.log
            exit 1
          fi

      - name: 起模拟器
        id: sim
        run: |
          set -euo pipefail
          echo '--- 公网可达性 ---'
          curl -sS -o /dev/null -w 'mobile page: %{http_code}  %{time_total}s\n' --max-time 30 https://m.zhuquan.xyz/mobile/ || true
          UDID=$(xcrun simctl list devices available | awk -F'[()]' '/iPhone/ {print $2; exit}')
          if [ -z "$UDID" ]; then echo "没有可用的 iPhone 模拟器"; xcrun simctl list devices available; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl list devices | grep "$UDID"

      - name: 装包
        id: install
        run: |
          set -euo pipefail
          UDID='${{ steps.sim.outputs.udid }}'
          APP=$(find ios/build -name 'DshMobile.app' -type d | head -1)
          echo "app=$APP"
          xcrun simctl uninstall "$UDID" "$APP_ID" || true
          xcrun simctl install "$UDID" "$APP"
          echo "app=$APP" >> "$GITHUB_OUTPUT"

      # 1) 首启：原生配对页
      - name: 首启截图（配对页）
        run: |
          set -euo pipefail
          UDID='${{ steps.sim.outputs.udid }}'
          xcrun simctl launch "$UDID" "$APP_ID"
          sleep 5
          xcrun simctl io "$UDID" screenshot shot-1-pairing.png

      # 2) 自检页：设备/构建/WKWebView DOM 计数
      - name: 自检页截图
        run: |
          set -euo pipefail
          UDID='${{ steps.sim.outputs.udid }}'
          xcrun simctl launch --terminate-running-process "$UDID" "$APP_ID" -selfcheck
          sleep 12
          xcrun simctl io "$UDID" screenshot shot-2-selfcheck.png

      # 3) 真实网页端（公网）：能渲染 + 原生扫码按钮被注入
      - name: 真实网页端截图
        run: |
          set -euo pipefail
          UDID='${{ steps.sim.outputs.udid }}'
          xcrun simctl launch --terminate-running-process "$UDID" "$APP_ID" -url https://m.zhuquan.xyz/mobile/
          sleep 20
          xcrun simctl io "$UDID" screenshot shot-3-live-shell.png

      - name: 收集日志
        if: always()
        run: |
          UDID='${{ steps.sim.outputs.udid }}'
          xcrun simctl spawn "$UDID" log show --last 5m --predicate "process == 'DshMobile'" --style compact > app.log 2>&1 || true
          tail -40 app.log || true

      # 4) 假电脑端：配对链路端到端（原生码注入 → 页面配对 → 外壳察觉已配对 → 落盘）
      - name: 配对 E2E（假电脑端）
        id: e2e
        run: |
          set -euo pipefail
          UDID='${{ steps.sim.outputs.udid }}'
          python3 .github/scripts/mock_bridge.py "$MOCK_PORT" > mock.log 2>&1 &
          echo $! > mock.pid
          sleep 2
          curl -sS -o /dev/null -w 'mock: %{http_code}\n' "http://127.0.0.1:$MOCK_PORT/mobile/"

          xcrun simctl launch --terminate-running-process "$UDID" "$APP_ID" \
            -url "http://127.0.0.1:$MOCK_PORT/mobile/" -paircode "$MOCK_CODE"
          sleep 16
          xcrun simctl io "$UDID" screenshot shot-4-paired.png

          DATA=$(xcrun simctl get_app_container "$UDID" "$APP_ID" data)
          PLIST="$DATA/Library/Preferences/$APP_ID.plist"
          echo "--- UserDefaults ---"
          for _ in $(seq 1 20); do
            [ -f "$PLIST" ] && break
            sleep 1
          done
          plutil -p "$PLIST" || true
          if plutil -p "$PLIST" 2>/dev/null | grep -q "http://127.0.0.1:$MOCK_PORT/mobile/"; then
            echo "PAIRING_OK=1" >> "$GITHUB_OUTPUT"
            echo "✅ 配对成功且 baseURL 已落盘"
          else
            echo "PAIRING_OK=0" >> "$GITHUB_OUTPUT"
            echo "❌ 没看到配对成功的落盘记录"
            exit 1
          fi

      # 5) 冷启动记忆：不带参数也直接进外壳
      - name: 冷启动记忆截图
        run: |
          set -euo pipefail
          UDID='${{ steps.sim.outputs.udid }}'
          xcrun simctl terminate "$UDID" "$APP_ID" || true
          xcrun simctl launch "$UDID" "$APP_ID"
          sleep 10
          xcrun simctl io "$UDID" screenshot shot-5-relaunch.png

      # 6) 断网/电脑端不在线：原生故障卡
      - name: 故障态截图
        run: |
          set -euo pipefail
          UDID='${{ steps.sim.outputs.udid }}'
          kill "$(cat mock.pid)" 2>/dev/null || true
          sleep 1
          xcrun simctl launch --terminate-running-process "$UDID" "$APP_ID" \
            -url "http://127.0.0.1:$MOCK_PORT/mobile/"
          sleep 12
          xcrun simctl io "$UDID" screenshot shot-6-offline.png

      - name: 桌面图标截图
        run: |
          set -euo pipefail
          UDID='${{ steps.sim.outputs.udid }}'
          xcrun simctl terminate "$UDID" "$APP_ID" || true
          sleep 3
          xcrun simctl io "$UDID" screenshot shot-7-home.png

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-${{ github.run_number }}
          path: |
            shot-*.png
            app.log
            mock.log
            ios/build.log
          if-no-files-found: warn

      - name: 附到 Release
        if: always() && (github.event_name == 'release' || inputs.tag != '' || startsWith(github.ref, 'refs/tags/ios-'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='${{ inputs.tag }}'
          if [ -z "$TAG" ] && [ '${{ github.event_name }}' = 'release' ]; then
            TAG='${{ github.event.release.tag_name }}'
          fi
          if [ -z "$TAG" ]; then TAG='${{ github.ref_name }}'; fi
          if [ '${{ steps.e2e.outputs.PAIRING_OK }}' != '1' ] && [ '${{ github.event_name }}' = 'release' ]; then
            echo "配对 E2E 未通过，拒绝往 Release 附包"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            cd ios/build/Build/Products/Debug-iphonesimulator
            NAME="dsh-mobile-ios-simulator-${TAG}.zip"
            zip -qry "/tmp/$NAME" DshMobile.app
            shasum -a 256 "/tmp/$NAME" > "/tmp/$NAME.sha256"
            gh release upload "$TAG" "/tmp/$NAME" "/tmp/$NAME.sha256" --clobber
            echo "已附到 ${TAG}：${NAME}（iOS ${{ steps.ver.outputs.version }} / ${{ steps.ver.outputs.code }}）"
          else
            echo "Release $TAG 不存在，跳过"
          fi
